[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sys"
version = "0.1.0"
description = "Sistema de agentes construido paso a paso"
requires-python = ">=3.11"

[project.scripts]
agent-sys = "agent_sys.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

