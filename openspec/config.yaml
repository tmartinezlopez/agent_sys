schema: spec-driven

context: |
  Runtime operativo Bash/Python para la metodología de trabajo del proyecto.
  La entrada publica prevista vive en scripts/pipeline/ y el ciclo de vida
  crea un worktree y una rama feature/<item> antes de lanzar agentes.
  El runtime usa procesos externos de Codex CLI mediante `codex exec`; no usa
  la API de OpenAI. Codex CLI local: 0.150.1. tmux local: 3.6.
  La ejecucion debe ser observable y persistente en .pipeline/runs/<run_id>
  mediante run.json, events.jsonl, estado derivado, summary.json y artefactos
  por etapa.
  El coordinador principal mantiene la visión global del proyecto, lanza y
  supervisa los agentes y decide cuándo avanzar. El pipeline final declara
  exactamente estos roles subordinados: spec-writer, implementer,
  test-runner, reviewer, ui-reviewer y qa. Todos usan gpt-5.6-luna.
  spec-writer, test-runner y reviewer usan
  razonamiento medium; implementer, ui-reviewer y qa usan low. No se deben
  introducir roles genericos ni configuraciones ficticias en produccion.
  No publicar cambios en GitHub salvo orden explicita del operador.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

rules:
  proposal:
    - Mantener el alcance en un bloque vertical verificable.
    - Declarar los no objetivos y no inventar equivalencias de Codex sin verificarlas.
  design:
    - Preferir contratos concretos y una unica fuente de verdad.
  tasks:
    - Cada tarea debe tener una prueba o comando de verificacion asociado.
    - No dejar mocks, agentes genericos o configuraciones falsas como runtime.

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

operations:
  apply:
    guidance:
      - Implementar por bloques coherentes y ejecutar pruebas tras cada bloque.
      - Mantener los cambios locales; no hacer push.
